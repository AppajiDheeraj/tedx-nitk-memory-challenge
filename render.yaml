services:
  - type: web
    name: tedx-nitk-memory-challenge
    runtime: go
    plan: free
    autoDeploy: true
    buildCommand: go build -trimpath -ldflags="-s -w" -o bin/server .
    startCommand: ./bin/server
    healthCheckPath: /health
    envVars:
      # The only required setting: the Neon connection string.
      - key: DATABASE_URL
        sync: false
      - key: GIN_MODE
        value: release
