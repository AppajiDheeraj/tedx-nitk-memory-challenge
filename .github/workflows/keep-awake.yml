name: Keep Render awake

on:
  schedule:
    # Every 10 minutes. GitHub can delay cron jobs, so also use UptimeRobot or keep-awake.sh.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the Render service
        run: |
          curl -fsS --retry 2 --retry-all-errors --max-time 90 \
            -o /dev/null \
            "https://tedx-nitk-memory-challenge.onrender.com/health"
